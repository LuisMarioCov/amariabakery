<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amaría Bakery</title>
    <meta
      name="description"
      content="Menú de Amaría Bakery en Colima. Arma tu pedido y envíalo por WhatsApp. Pago en efectivo o transferencia al recoger o al entregar."
    />
    <meta name="theme-color" content="#F1F1EF" />
    <link rel="icon" href="/brand/logo-seal.webp" type="image/webp" />
  </head>
  <body>
    <a href="#menu" class="skip-link">Saltar al menú</a>
    <div id="header" style="min-height: 6.25rem">
      <header id="header-fallback" class="sticky top-0 z-20 border-b border-sand bg-paper">
        <div class="mx-auto grid min-h-[6.25rem] max-w-6xl grid-cols-[1fr_auto_1fr] items-center px-4 sm:px-6">
          <div></div>
          <a href="#inicio" class="justify-self-center">
            <img src="/brand/logo-wordmark.webp" alt="Amaría Bakery" width="280" height="118" class="h-16 w-auto sm:h-20" />
          </a>
          <a href="https://instagram.com/amaria_bakery" class="justify-self-end grid h-14 w-14 place-items-center text-ink" aria-label="Instagram" rel="noreferrer" target="_blank">
            <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7">
              <rect x="3" y="3" width="18" height="18" rx="5"></rect>
              <circle cx="12" cy="12" r="4"></circle>
              <circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" stroke="none"></circle>
            </svg>
          </a>
        </div>
      </header>
    </div>
    <section id="inicio" aria-label="Amaría Bakery" class="bg-paper">
      <div class="grid gap-1.5 lg:min-h-[calc(100svh-6.25rem)] lg:grid-cols-[1.35fr_0.85fr]">
        <img
          src="/brand/hero-fachada.webp"
          srcset="/brand/hero-fachada-720.webp 720w, /brand/hero-fachada-840.webp 840w, /brand/hero-fachada.webp 1100w"
          sizes="(min-width: 1024px) 58vw, 100vw"
          alt="Fachada de Amaría Bakery, con el toldo de rayas"
          width="1100"
          height="1184"
          fetchpriority="high"
          decoding="async"
          class="h-[68vh] w-full object-cover object-[center_28%] lg:h-full"
        />
        <div class="grid grid-cols-2 gap-1.5 lg:grid-cols-1 lg:grid-rows-2">
          <img
            src="/brand/hero-taza.jpg"
            alt="Vaso de Amaría Bakery con café"
            width="660"
            height="500"
            class="h-44 w-full object-cover sm:h-64 lg:h-full"
          />
          <img
            src="/brand/hero-bolsa.jpg"
            alt="Bolsa de Amaría Bakery"
            width="1100"
            height="825"
            class="h-44 w-full object-cover sm:h-64 lg:h-full"
          />
        </div>
      </div>
    </section>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
